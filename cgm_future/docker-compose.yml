version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cgm_postgres
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: cgm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: cgm_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_TYPE=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=cgm_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
    depends_on:
      - db

volumes:
  pgdata:
